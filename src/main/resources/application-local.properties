# Direct local JVM runs use the same database engine as container/runtime paths.
spring.datasource.url=${PROFILE_DB_URL:jdbc:postgresql://localhost:5432/user_profile}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${PROFILE_DB_USERNAME:user_profile}
spring.datasource.password=${PROFILE_DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false
