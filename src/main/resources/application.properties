spring.application.name=user-profile-service
spring.profiles.default=local
server.port=${SERVER_PORT:8085}
profile.request.maximum-body-bytes=${PROFILE_REQUEST_MAXIMUM_BODY_BYTES:65536}

# Flyway is the sole schema owner. Hibernate only verifies entity/schema compatibility.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

# Actuator configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%X{serviceName}] [%thread] %logger{36} - %msg%n
logging.level.com.jobseekercopilot=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.web=INFO
logging.level.org.springframework.http=INFO
