spring.application.name=user-profile-service
spring.datasource.url=${PROFILE_DB_URL:jdbc:h2:file:./data/user-profile;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
server.port=${SERVER_PORT:8085}
profile.request.maximum-body-bytes=${PROFILE_REQUEST_MAXIMUM_BODY_BYTES:65536}
spring.h2.console.settings.web-allow-others=true

# Actuator configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%X{serviceName}] [%thread] %logger{36} - %msg%n
logging.level.com.jobseekercopilot=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.web=INFO
logging.level.org.springframework.http=INFO
