spring.application.name=user-profile-service
spring.profiles.default=local
server.port=${SERVER_PORT:8085}
profile.request.maximum-body-bytes=${PROFILE_REQUEST_MAXIMUM_BODY_BYTES:65536}
environment-data.enabled=${ENVIRONMENT_DATA_ENABLED:false}
environment-data.token=${ENVIRONMENT_DATA_TOKEN:}
environment-data.allowed-environments=${ENVIRONMENT_DATA_ALLOWED_ENVIRONMENTS:local,test,demo}
profile.security.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:8084/.well-known/jwks.json}
profile.security.issuer=${PROFILE_JWT_ISSUER:job-seeker-copilot-authentication}
profile.security.audience=${PROFILE_JWT_AUDIENCE:job-seeker-copilot-services}

# Flyway is the sole schema owner. Hibernate only verifies entity/schema compatibility.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false

# Actuator configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.show-details=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%X{serviceName}] [%thread] %logger{36} - %msg%n
logging.level.com.jobseekercopilot=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.web=INFO
logging.level.org.springframework.http=INFO
