server.port=0
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.h2.console.settings.web-allow-others=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.show-details=never
profile.request.maximum-body-bytes=65536
profile.security.jwk-set-uri=http://127.0.0.1:1/.well-known/jwks.json
profile.security.issuer=job-seeker-copilot-authentication
profile.security.audience=job-seeker-copilot-services
logging.level.org.springframework.web=INFO
logging.level.org.springframework.http=INFO
